<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LytiaHEN Exploit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Quicksand', 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #d8b4fe 100%);
    color: #2d2640;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow-x: hidden;
    user-select: none;
  }
  .glass-panel {
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 20px 40px rgba(116, 90, 138, 0.2);
    border-radius: 36px;
    width: 100%;
    max-width: 750px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .brand-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 2px solid rgba(216, 180, 254, 0.3);
    padding-bottom: 16px;
    text-align: center;
  }
  h1 {
    font-size: 38px;
    font-weight: 700;
    color: #4c1d95;
    margin: 0;
  }
  .subtitle {
    font-size: 15px;
    color: #7c3aed;
    font-weight: 600;
    margin: 0;
  }
  .stack-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .chibi-floating-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 0;
  }
  #chibi-img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(116, 90, 138, 0.25));
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(233, 213, 255, 0.8);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 8px 20px rgba(116, 90, 138, 0.08);
  }
  .status-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #9333ea;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #console {
    font-size: 20px;
    font-weight: 700;
    color: #2d2640;
    margin-bottom: 8px;
    line-height: 1.4;
    word-break: break-all;
  }
  .progress-container { margin-top: 18px; }
  .progress-bar-bg {
    width: 100%;
    background-color: #f3e8ff;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, #c084fc 0%, #ec4899 100%);
    height: 100%;
    width: 15%;
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .footer-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #7c3aed;
    padding-top: 12px;
    border-top: 2px solid rgba(216, 180, 254, 0.3);
    font-weight: 600;
  }
  .ok { color: #059669 !important; font-weight: 700; }
  .bad { color: #e11d48 !important; font-weight: 700; }
  .warn { color: #d97706 !important; font-weight: 700; }
  #msgs { display: none; }
</style>
</head>
<body>
  <div class="glass-panel">
    <div class="brand-header">
      <h1>LytiaHEN Exploit</h1>
      <p class="subtitle">Executing jailbreak payload</p>
    </div>
    <div class="stack-container">
      <div class="chibi-floating-container">
        <img id="chibi-img" src="chibi-loading.png" alt="Chibi">
      </div>
      <div class="glass-card">
        <div>
          <div class="status-label">EXPLOIT STATUS</div>
          <div id="console" class="warn">Initializing environment...</div>
        </div>
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-info">
      <span>Forked From RAWGAME | UI By ayayashiori</span>
      <span>Keep calm & exploit</span>
    </div>
  </div>
  <div id="msgs"></div>
<script>
  const consoleEl = document.getElementById('console');
  const imgEl = document.getElementById('chibi-img');
  const progressBar = document.getElementById('progress-bar');
  const observer = new MutationObserver(function(mutations) {
    const msgsDiv = document.getElementById('msgs');
    if (msgsDiv && msgsDiv.lastChild) {
      let text = msgsDiv.lastChild.textContent || "";
      consoleEl.textContent = text;
      if (text.includes("Done") || text.includes("Success") || text.includes("GoldHEN")) {
        consoleEl.className = "ok";
        imgEl.src = "chibi-success.png";
        progressBar.style.width = "100%";
        progressBar.style.background = "linear-gradient(90deg, #10b981 0%, #059669 100%)";
      } else if (text.includes("Fail") || text.includes("Error") || text.includes("Out of memory")) {
        consoleEl.className = "bad";
        imgEl.src = "chibi-failed.png";
        progressBar.style.width = "100%";
        progressBar.style.background = "linear-gradient(90deg, #f43f5e 0%, #e11d48 100%)";
      } else if (text.includes("Jumping") || text.includes("Spray") || text.includes("WebKit")) {
        consoleEl.className = "warn";
        imgEl.src = "chibi-loading.png";
        progressBar.style.width = "75%";
      } else {
        consoleEl.className = "warn";
        imgEl.src = "chibi-loading.png";
        progressBar.style.width = "45%";
      }
    }
  });
  window.addEventListener('DOMContentLoaded', () => {
    const msgsDiv = document.getElementById('msgs');
    if (msgsDiv) {
      observer.observe(msgsDiv, { childList: true, subtree: true });
    }
  });
</script>
<script src="int64.js"></script>
<script src="jb.js"></script>
<script src="core.js"></script>
</body>
</html>
