<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LytiaHEN Exploit ★</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Quicksand', 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #d8b4fe 100%);
    color: #2d2640;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow-x: hidden;
    user-select: none;
  }
  .glass-panel {
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 20px 40px rgba(116, 90, 138, 0.2);
    border-radius: 36px;
    width: 100%;
    max-width: 750px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .brand-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 2px solid rgba(216, 180, 254, 0.3);
    padding-bottom: 16px;
    text-align: center;
  }
  h1 {
    font-size: 38px;
    font-weight: 700;
    color: #4c1d95;
    margin: 0;
  }
  .subtitle {
    font-size: 15px;
    color: #7c3aed;
    font-weight: 600;
    margin: 0;
  }
  .stack-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .chibi-floating-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 0;
  }
  #chibi-img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(116, 90, 138, 0.25));
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(233, 213, 255, 0.8);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 8px 20px rgba(116, 90, 138, 0.08);
  }
  .status-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #9333ea;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  
  /* Area log asli yang dipakai oleh skrip RAWGAME */
  #msgs {
    font-size: 18px;
    font-weight: 700;
    color: #2d2640;
    word-break: break-all;
    min-height: 30px;
  }

  .progress-container { margin-top: 18px; }
  .progress-bar-bg {
    width: 100%;
    background-color: #f3e8ff;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, #c084fc 0%, #ec4899 100%);
    height: 100%;
    width: 100%;
    border-radius: 999px;
  }
  .footer-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #7c3aed;
    padding-top: 12px;
    border-top: 2px solid rgba(216, 180, 254, 0.3);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="glass-panel">
    <div class="brand-header">
      <h1>LytiaHEN Exploit ★</h1>
      <p class="subtitle">Executing jailbreak payload</p>
    </div>
    <div class="stack-container">
      <div class="chibi-floating-container">
        <img id="chibi-img" src="chibi-loading.png" alt="Chibi">
      </div>
      <div class="glass-card">
        <div>
          <div class="status-label">EXPLOIT STATUS</div>
          <!-- Elemen ID msgs ini murni dibiarkan tanpa gangguan observer agar skrip asli langsung menulis ke sini -->
          <div id="msgs">Initializing...</div>
        </div>
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-info">
      <span>Forked From RAWGAME | UI By ayayashiori</span>
      <span>Pstt, my name is Seka-chan! Get it? Because Orbis means world so is sekai ♥</span>
    </div>
  </div>

<script>
  // Opsional: Mengganti gambar chibi otomatis saat teks di msgs berubah
  const msgsEl = document.getElementById('msgs');
  const imgEl = document.getElementById('chibi-img');

  if (msgsEl) {
    const observer = new MutationObserver(() => {
      let t = msgsEl.textContent || "";
      if (t.includes("Done") || t.includes("Success") || t.includes("GoldHEN")) {
        imgEl.src = "chibi-success.png";
      } else if (t.includes("Fail") || t.includes("Error")) {
        imgEl.src = "chibi-failed.png";
      }
    });
    observer.observe(msgsEl, { childList: true, subtree: true, characterData: true });
  }
</script>

<!-- Skrip inti bawaan asli RAWGAME -->
<script src="int64.js"></script>
<script src="jb.js"></script>
<script src="core.js"></script>
</body>
</html>
