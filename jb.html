<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LytiaHEN Exploit (◍•ᴗ•◍)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f3edf9 0%, #e2d1f0 50%, #f7f2fb 100%);
        color: #2d2640;
        font-family: 'Quicksand', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #brand {
        text-align: center;
        padding: 12px 16px;
        background: rgba(244, 238, 250, 0.7);
        border-bottom: 1px solid rgba(222, 196, 235, 0.4);
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #5b3e7a;
      }

      /* Container card ala LytiaHEN */
      .exploit-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(222, 196, 235, 0.6);
        box-shadow: 0 20px 50px rgba(116, 90, 138, 0.15);
        border-radius: 24px;
        padding: 30px;
        width: 90%;
        max-width: 420px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      /* Chibi preview di jb.html */
      .chibi-mini-box {
        width: 120px;
        height: 120px;
        background: #faf6fd;
        border: 2px dashed #e2cff0;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
      }
      .chibi-mini-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Spinner imut nuansa anime */
      #spin {
        width: 40px;
        height: 40px;
        border: 4px solid #f0e6f6;
        border-top-color: #d8b4fe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        font-size: 16px;
        font-weight: 700;
        color: #d97706;
        line-height: 1.4;
      }

      body.fail #msg {
        color: #ef4444;
      }
      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }

      /* ?log=1 styling */
      body.log #spin,
      body.log .exploit-card {
        display: none;
      }
      body.log #wrap {
        padding: 80px 18px 20px;
        width: 100%;
        max-width: 620px;
        display: block !important;
      }
      #wrap {
        display: none;
      }
      #state {
        font-size: 20px;
        font-weight: 700;
        color: #3b2b4f;
        margin-bottom: 10px;
        text-align: center;
      }
      #out {
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(222, 196, 235, 0.6);
        border-radius: 16px;
        padding: 16px;
        height: calc(100vh - 160px);
        overflow-y: auto;
        color: #5b3e7a;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>LytiaHEN Exploit (っ˘ω˘ς)</b>
    </div>

    <!-- Kotak Tampilan Eksploitasi yang Senada dengan index.html -->
    <div class="exploit-card" id="exploit-ui">
      <div class="chibi-mini-box">
        <img id="jb-chibi" src="chibi-loading.png" alt="Chibi">
      </div>
      <div id="spin"></div>
      <div id="msg">Please wait, I'm accessing your RAM! (っ˘ω˘ς)</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script>
      // Listener otomatis untuk mengubah gambar chibi saat proses jb.js mengubah status/kelas body
      const observer = new MutationObserver(() => {
        const img = document.getElementById('jb-chibi');
        const msg = document.getElementById('msg');
        if (document.body.classList.contains('done')) {
          img.src = 'chibi-success.png';
          msg.textContent = "Done! Enjoy your game, Bro! (≧◡≦) ♡";
          msg.style.color = "#16a34a";
        } else if (document.body.classList.contains('fail')) {
          img.src = 'chibi-failed.png';
          msg.textContent = "Uwaahhh! Exploit failed, please restart your console! (╥﹏╥)";
          msg.style.color = "#ef4444";
        }
      });
      observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
